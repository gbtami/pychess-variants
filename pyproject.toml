[project]
name = "pychess-variants"
version = "0.1.0"
description = "Chess variants server"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp==3.14.3",
    "aiohttp-cors==0.8.1",
    "aiohttp-jinja2==1.6",
    "aiohttp-session==2.12.1",
    "aiohttp-sse==2.2.0",
    "aiohttp-swagger3==0.10.0",
    "betza-visualizer==0.1.0",
    "brotli==1.2.0",
    "cryptography==49.0.0",
    "discord-py==2.7.1",
    "dnspython==2.8.0",
    "jinja2==3.1.6",
    "minify-html==0.18.1",
    "pyffish==0.0.89",
    "pyffish-alice==0.0.3",
    "py4swiss==0.3.1",
    "pymongo==4.17.0",
    "pywebpush==2.3.0",
    "rapidfuzz==3.14.5",
    "pyopenssl==26.3.0",
    "python-gettext==5.0",
    "rustworkx==0.18.0",
    "sortedcollections==2.1.0",
    "tenacity==9.1.4",
    "tzdata==2026.3",
    "msgspec==0.21.1",
]

[project.optional-dependencies]
dev = [
    "mongomock-motor==0.0.36",
    "motor==3.7.1",
    "objgraph==3.6.2",
    "playwright==1.61.0",
    "pre-commit>=4.5.1",
    "pytest<10.0.0",
    "pytest-aiohttp==1.1.1",
    "pyright==1.1.411",
    "ruff==0.16.0",
    "textual==8.2.8",
    "tqdm>=4.67.3",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# Converting established percent formatting to str.format() is not behavior-neutral
# for all objects and would make many logging-style expressions less readable.
ignore = ["UP031"]

[tool.ruff.lint.per-file-ignores]
# Keep runtime-compatible typing declarations where PEP 695 rewrites can change
# runtime type objects, generic metadata, or class MRO.
"server/bot_api.py" = ["BLE001", "UP040"]
"server/bugchess/__init__.py" = ["UP046"]
"server/bugchess/engine.py" = ["BLE001", "UP046", "UP047"]
"server/bugchess/pgn.py" = ["UP046", "UP047"]
"server/bugchess/variant.py" = ["PYI059", "UP046"]
"server/const.py" = ["UP040"]
"server/routes.py" = ["UP040"]
"server/tournament/tournament.py" = ["BLE001", "UP040"]
"server/websocket_utils.py" = ["BLE001", "UP047"]
"server/ws_types.py" = ["UP040"]

# Broad catches and quiet fallbacks are intentional at these process, network,
# import, and maintenance boundaries. Changing their exception coverage can alter
# recovery behavior, so retain it while keeping these rules active elsewhere.
"monitor/monitor.py" = ["BLE001"]
"scripts/backfill_user_created_at_from_games.py" = ["BLE001"]
"scripts/fix_dragonfly_castling_rights.py" = ["TRY004"]
"scripts/inspect_game_indexes.py" = ["BLE001"]
"scripts/puzzle_mate1_supply.py" = ["BLE001"]
"scripts/py4swiss_memory_stress.py" = ["BLE001"]
"server/bug/import_bugh_game.py" = ["BLE001"]
"server/export2pgn.py" = ["BLE001"]
"server/fairy/fairy_board.py" = ["BLE001", "S110"]
"server/fishnet.py" = ["BLE001"]
"server/forum/captcha.py" = ["BLE001"]
"server/game.py" = ["BLE001", "S110"]
"server/game_api.py" = ["BLE001", "S110"]
"server/header_challenges.py" = ["BLE001", "S110"]
"server/import_puzzles.py" = ["BLE001"]
"server/inbox_api.py" = ["BLE001", "S110"]
"server/legacy_blog_catalog.py" = ["TRY004"]
"server/logger.py" = ["BLE001"]
"server/login.py" = ["BLE001"]
"server/push_notifications.py" = ["BLE001"]
"server/puzzle.py" = ["BLE001"]
"server/pychess_global_app_state.py" = ["BLE001"]
"server/server_metrics.py" = ["BLE001"]
"server/user.py" = ["BLE001"]
"server/utils.py" = ["BLE001", "S110"]
"server/views/__init__.py" = ["BLE001"]
"server/views/ublog.py" = ["BLE001"]
"server/views/user_mini.py" = ["BLE001"]
"tests/client_stresstest.py" = ["BLE001"]

[tool.setuptools]
packages = []  # Disable package discovery
