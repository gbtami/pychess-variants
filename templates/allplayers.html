{% extends "template.html" %}
{% block content %}
<main class="allplayers">
    {% for user in allusers %}
        <div class="player-data">
        {% if user.patron %}<i-side class="{% if user.online %}online{% else %}offline{% endif %} icon icon-patron-wing" title="{{ _('PyChess Patron') }}"></i-side>{% endif %}
        <player>
            <a class="user-link" href="{{ home }}/@/{{ user.username }}"><player-title>{{ user.title }}</player-title> {{ user.username }}</a>
        </player>
        </div>
    {% endfor %}
</main>
{% endblock %}
{% block js %}
    <script src="{{ js }}"></script>
{% endblock %}
